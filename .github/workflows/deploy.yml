name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # 写入构建时间戳，保证每次运行 gh-pages 都有新提交、必定触发 Pages 重建
      - run: date -u +'%Y-%m-%dT%H:%M:%SZ' > dist/.build-stamp

      # 推送到 gh-pages 分支，站点以 legacy 模式从该分支自动构建发布
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
