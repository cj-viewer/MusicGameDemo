name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach gh-pages-dist origin/gh-pages
          find gh-pages-dist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. gh-pages-dist/
          touch gh-pages-dist/.nojekyll
          cd gh-pages-dist
          git add -A
          if git diff --cached --quiet; then
            echo "No Pages artifact changes to publish."
            exit 0
          fi
          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
